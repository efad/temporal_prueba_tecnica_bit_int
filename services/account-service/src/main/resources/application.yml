spring:
  application:
    name: account-service
  datasource:
    url: jdbc:h2:mem:account;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: sa
  jpa:
    hibernate:
      ddl-auto: create
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC

server:
  port: 8081

app:
  simulation:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} correlationId=%X{correlationId:-} sagaId=%X{sagaId:-} %-5level %logger{36} - %msg%n"

springdoc:
  swagger-ui:
    path: /swagger-ui.html
