spring:
  application:
    name: account-opening-orchestrator-service
  datasource:
    url: jdbc:h2:mem:orchestrator;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: sa
  jpa:
    hibernate:
      ddl-auto: create
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC

server:
  port: 8080

app:
  simulation:
    enabled: true
  opening:
    currency: COP
    initial-deposit: 0.00
    commissions:
      DEBIT: 15000.00
      CREDIT: 35000.00
  clients:
    account-service-url: ${ACCOUNT_SERVICE_URL:http://localhost:8081}
    card-service-url: ${CARD_SERVICE_URL:http://localhost:8082}

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 4
        minimum-number-of-calls: 4
        failure-rate-threshold: 50
        slow-call-rate-threshold: 50
        slow-call-duration-threshold: 1s
        wait-duration-in-open-state: 15s
        permitted-number-of-calls-in-half-open-state: 2
        register-health-indicator: false
        record-exceptions:
          - com.pruebatecnica.platform.error.RemoteDependencyException
          - org.springframework.web.client.ResourceAccessException
        ignore-exceptions:
          - com.pruebatecnica.platform.error.BusinessException
          - com.pruebatecnica.platform.error.ConflictException
          - com.pruebatecnica.platform.error.NotFoundException
    instances:
      accountService:
        base-config: default
      cardService:
        base-config: default
  bulkhead:
    configs:
      default:
        max-concurrent-calls: 20
        max-wait-duration: 0
    instances:
      accountService:
        base-config: default
      cardService:
        base-config: default

management:
  endpoints:
    web:
      exposure:
        include: health,info,circuitbreakers
  endpoint:
    health:
      probes:
        enabled: true
  health:
    circuitbreakers:
      enabled: false

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} correlationId=%X{correlationId:-} sagaId=%X{sagaId:-} %-5level %logger{36} - %msg%n"

springdoc:
  swagger-ui:
    path: /swagger-ui.html
